<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    color: #ffffff;
    background: #f97316;
  }

  .canvas {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background:
      radial-gradient(circle at 75% 18%, rgba(255, 237, 173, 0.58) 0, rgba(255, 237, 173, 0) 260px),
      radial-gradient(circle at 18% 88%, rgba(255, 255, 255, 0.18) 0, rgba(255, 255, 255, 0) 260px),
      linear-gradient(180deg, #c2410c 0%, #f97316 52%, #ffb238 100%);
  }

  .header {
    position: absolute;
    z-index: 5;
    top: 54px;
    left: 72px;
    right: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: rgba(255, 255, 255, 0.82);
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 0;
  }

  .label {
    font-size: 24px;
    font-weight: 850;
    opacity: 0.9;
  }

  .copy {
    position: absolute;
    z-index: 5;
    left: 78px;
    top: 150px;
    width: 470px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    height: 48px;
    padding: 0 22px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.28);
    color: #fff7ed;
    font-size: 24px;
    font-weight: 950;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
  }

  h1 {
    margin-top: 22px;
    font-size: 66px;
    font-weight: 950;
    line-height: 1.08;
    letter-spacing: 0;
    text-shadow: 0 8px 26px rgba(92, 33, 5, 0.24);
  }

  h1 strong {
    color: #fff1b8;
  }

  .caption {
    margin-top: 20px;
    color: rgba(255, 255, 255, 0.9);
    font-size: 26px;
    font-weight: 800;
    line-height: 1.38;
    letter-spacing: 0;
  }

  .score {
    position: absolute;
    z-index: 6;
    right: 136px;
    top: 282px;
    display: flex;
    align-items: center;
    gap: 25px;
    filter: drop-shadow(0 18px 30px rgba(92, 33, 5, 0.24));
  }

  .score-badge {
    display: grid;
    place-items: center;
    width: 86px;
    height: 62px;
    border-radius: 16px;
    background: #ffffff;
    color: #ff7a18;
    font-size: 31px;
    font-weight: 950;
    letter-spacing: 0;
  }

  .score-number {
    font-size: 128px;
    font-weight: 950;
    line-height: 1;
    letter-spacing: 0;
  }

  .score-caption {
    position: absolute;
    z-index: 6;
    right: 112px;
    top: 430px;
    width: 440px;
    text-align: center;
    color: rgba(255, 255, 255, 0.95);
    font-size: 34px;
    font-weight: 950;
    letter-spacing: 0;
    text-shadow: 0 8px 22px rgba(92, 33, 5, 0.22);
  }

  .progress {
    position: absolute;
    z-index: 6;
    right: 126px;
    bottom: 74px;
    width: 430px;
    height: 34px;
    padding: 6px;
    border-radius: 999px;
    background: #ffffff;
    box-shadow: 0 14px 30px rgba(92, 33, 5, 0.18);
  }

  .progress::before {
    content: "4";
    position: absolute;
    left: -36px;
    top: -5px;
    color: rgba(255, 255, 255, 0.82);
    font-size: 26px;
    font-weight: 950;
  }

  .progress::after {
    content: "5";
    position: absolute;
    right: -36px;
    top: -5px;
    color: rgba(255, 255, 255, 0.82);
    font-size: 26px;
    font-weight: 950;
  }

  .progress-fill {
    width: 94%;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #ea580c 0%, #ffb238 100%);
    box-shadow: 0 0 22px rgba(255, 178, 56, 0.75);
  }

  .progress-tip {
    position: absolute;
    right: 12px;
    top: 6px;
    width: 22px;
    height: 22px;
    border-radius: 999px;
    background: #ffffff;
    box-shadow: 0 0 18px rgba(255, 255, 255, 0.85);
  }

  .hero {
    position: absolute;
    z-index: 4;
    right: 390px;
    top: 124px;
    width: 186px;
    height: 186px;
    transform: rotate(-10deg);
  }

  .hero-glow {
    position: absolute;
    inset: -34px;
    border-radius: 999px;
    background: radial-gradient(circle, rgba(255, 241, 184, 0.56) 0, rgba(255, 241, 184, 0) 72%);
  }

  .hero-ring {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
    border: 12px solid #fff1b8;
    border-radius: 42px 90px 90px 90px;
    background: #fff7e9;
    box-shadow: 0 20px 42px rgba(92, 33, 5, 0.26);
  }

  .hero-ring img {
    width: 138px;
    height: 138px;
    object-fit: contain;
    transform: rotate(10deg);
  }

  .orb {
    position: absolute;
    z-index: 3;
    right: 176px;
    top: 86px;
    display: grid;
    place-items: center;
    width: 178px;
    height: 178px;
    border: 14px solid #fff1b8;
    border-radius: 999px 999px 999px 42px;
    background:
      linear-gradient(135deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0) 44%),
      #ffb238;
    box-shadow: 0 18px 45px rgba(92, 33, 5, 0.22), 0 0 52px rgba(255, 241, 184, 0.42);
    transform: rotate(14deg);
  }

  .orb-star {
    width: 74px;
    height: 74px;
    background: #ffffff;
    clip-path: polygon(50% 0, 62% 34%, 98% 34%, 69% 55%, 80% 91%, 50% 70%, 20% 91%, 31% 55%, 2% 34%, 38% 34%);
  }

  .cloud {
    position: absolute;
    z-index: 1;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.78);
  }

  .cloud::before,
  .cloud::after {
    content: "";
    position: absolute;
    border-radius: 999px;
    background: inherit;
  }

  .cloud.c1 {
    left: -82px;
    top: 122px;
    width: 240px;
    height: 72px;
    opacity: 0.48;
  }

  .cloud.c1::before {
    left: 42px;
    top: -44px;
    width: 104px;
    height: 104px;
  }

  .cloud.c1::after {
    right: 26px;
    top: -24px;
    width: 86px;
    height: 86px;
  }

  .cloud.c2 {
    right: -74px;
    bottom: 136px;
    width: 270px;
    height: 78px;
    opacity: 0.64;
  }

  .cloud.c2::before {
    left: 56px;
    top: -42px;
    width: 108px;
    height: 108px;
  }

  .cloud.c2::after {
    right: 38px;
    top: -24px;
    width: 88px;
    height: 88px;
  }

  .cloud.c3 {
    left: 330px;
    bottom: 72px;
    width: 210px;
    height: 58px;
    opacity: 0.44;
  }

  .cloud.c3::before {
    left: 42px;
    top: -28px;
    width: 78px;
    height: 78px;
  }

  .cloud.c3::after {
    right: 36px;
    top: -18px;
    width: 66px;
    height: 66px;
  }

  .shine {
    position: absolute;
    z-index: 4;
    width: 28px;
    height: 28px;
    transform: rotate(45deg);
    border-radius: 7px;
    background: #fff1b8;
    box-shadow: 0 0 24px rgba(255, 241, 184, 0.7);
  }

  .shine.s1 { right: 560px; top: 118px; }
  .shine.s2 { right: 352px; top: 96px; width: 20px; height: 20px; }
  .shine.s3 { right: 610px; bottom: 156px; width: 18px; height: 18px; }

  .trail {
    position: absolute;
    z-index: 2;
    right: 520px;
    top: 294px;
    width: 360px;
    height: 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.28);
    transform: rotate(-13deg);
  }

  .trail::before {
    content: "";
    position: absolute;
    right: 38px;
    top: 26px;
    width: 250px;
    height: 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.18);
  }
</style>
</head>
<body>
  <main class="canvas" aria-label="머니터미 공유 이미지">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="trail"></div>
    <div class="shine s1"></div>
    <div class="shine s2"></div>
    <div class="shine s3"></div>

    <header class="header">
      <div>머니터미</div>
      <div class="label">오늘의 성장 기록</div>
    </header>

    <section class="copy">
      <div class="eyebrow">4에서 5로 레벨업</div>
      <h1>경제 공부,<br /><strong>오늘도 한 칸</strong><br />올렸어요</h1>
      <p class="caption">쉬운 예시와 퀴즈로<br />돈 이야기가 조금씩 보여요.</p>
    </section>

    <div class="orb" aria-hidden="true">
      <div class="orb-star"></div>
    </div>

    <div class="hero" aria-hidden="true">
      <div class="hero-glow"></div>
      <div class="hero-ring">
        <img src="../../public/logo.png" alt="" />
      </div>
    </div>

    <div class="score" aria-hidden="true">
      <div class="score-badge">Lv</div>
      <div class="score-number">5</div>
    </div>
    <div class="score-caption">경제 이해력을 올렸어요</div>

    <div class="progress" aria-hidden="true">
      <div class="progress-fill"></div>
      <div class="progress-tip"></div>
    </div>
  </main>
</body>
</html>
