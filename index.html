<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>머니터미</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        document.body.style.background = '#fff';
        document.body.innerHTML = '<pre style="padding:20px;font-size:12px;color:red;white-space:pre-wrap">[JS Error]\n' + msg + '\n' + (err && err.stack ? err.stack : '') + '</pre>';
      };
      window.addEventListener('unhandledrejection', function(e) {
        document.body.style.background = '#fff';
        document.body.innerHTML = '<pre style="padding:20px;font-size:12px;color:red;white-space:pre-wrap">[Unhandled Promise]\n' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '</pre>';
      });
    </script>
    <script>
      window.__CONSTANT_HANDLER_MAP = {
        getSafeAreaInsets: { top: 0, bottom: 0 },
        getAppName: 'moneytermi',
        getDeploymentId: 'local',
        getWebViewType: 'web',
        getPlatformOS: 'web',
        getOperationalEnvironment: 'production',
        getTossAppVersion: '0.0.0',
        getDeviceId: 'browser',
        getGroupId: '',
        getLocale: navigator.language || 'ko-KR',
        getSchemeUri: '',
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
