<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- Pretendard: 화면에 쓰인 글자만 조각으로 받는 가변 폰트(dynamic subset) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F7F9" />
    <title>머니터미</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 오류 문구는 textContent로 넣는다(문구에 섞인 HTML이 실행되지 않게)
      function showFatal(title, detail) {
        document.body.style.background = '#fff';
        var pre = document.createElement('pre');
        pre.style.cssText = 'padding:20px;font-size:12px;color:red;white-space:pre-wrap';
        pre.textContent = title + '\n' + detail;
        document.body.replaceChildren(pre);
      }
      window.onerror = function(msg, src, line, col, err) {
        showFatal('[JS Error]', msg + '\n' + (err && err.stack ? err.stack : ''));
      };
      window.addEventListener('unhandledrejection', function(e) {
        showFatal('[Unhandled Promise]', String(e.reason && e.reason.stack ? e.reason.stack : e.reason));
      });
    </script>
    <script>
      window.__CONSTANT_HANDLER_MAP = {
        getSafeAreaInsets: { top: 0, bottom: 0 },
        getAppName: 'moneytermi',
        getDeploymentId: 'local',
        getWebViewType: 'web',
        getPlatformOS: 'web',
        getOperationalEnvironment: 'production',
        getTossAppVersion: '0.0.0',
        getDeviceId: 'browser',
        getGroupId: '',
        getLocale: navigator.language || 'ko-KR',
        getSchemeUri: '',
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
